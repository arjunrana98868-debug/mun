<!DOCTYPE html>
<!-- File: frontend/public/index.html -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CV Analyzer - Programmer Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0b0f19 0%, #111827 50%, #0d1322 100%);
      --card: rgba(23, 31, 48, 0.8);
      --card-solid: #171f30;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --accent: #3b82f6;
      --accent-glow: rgba(59, 130, 246, 0.25);
      --border: rgba(255, 255, 255, 0.09);
      --border-accent: rgba(59, 130, 246, 0.35);
      --track: rgba(255, 255, 255, 0.06);
      --danger: #ef4444;
      --danger-bg: rgba(239, 68, 68, 0.14);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      background: var(--bg-gradient); color: var(--text); min-height: 100vh; padding-bottom: 60px; line-height: 1.5;
    }
    .navbar-outer {
      position: sticky; top: 0; z-index: 100; background: var(--card); backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border); margin-bottom: 32px;
    }
    .navbar {
      max-width: 1200px; margin: 0 auto; padding: 12px 24px;
      display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
    }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.12rem; color: var(--text); text-decoration: none; }
    .brand-icon {
      width: 36px; height: 36px; border-radius: 10px; background: linear-gradient(135deg, var(--accent), #1d4ed8);
      display: flex; align-items: center; justify-content: center; color: #fff; font-size: 1.2rem;
    }
    nav { display: flex; gap: 6px; background: var(--track); padding: 4px; border-radius: 12px; border: 1px solid var(--border); flex-wrap: wrap; }
    nav a {
      padding: 8px 14px; border-radius: 8px; color: var(--muted); text-decoration: none;
      font-size: 0.86rem; font-weight: 600; display: flex; align-items: center; gap: 6px;
    }
    nav a:hover { color: var(--text); }
    nav a.on { background: var(--card-solid); color: var(--text); border: 1px solid var(--border); }
    button.logout {
      font-family: inherit; font-size: 0.84rem; font-weight: 600; padding: 7px 13px; border-radius: 9px;
      background: var(--danger-bg); color: var(--danger); border: 1px solid rgba(239,68,68,0.3);
      cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
    }
    main { width: 100%; max-width: 680px; margin: 0 auto; padding: 0 24px; }
    .header-title { text-align: center; margin-bottom: 24px; }
    .header-title h1 { font-size: 1.8rem; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 10px; }
    .header-title h1 i { color: var(--accent); }
    p.sub { color: var(--muted); font-size: 0.92rem; margin-top: 6px; }
    .card {
      background: var(--card); backdrop-filter: blur(16px); border: 1px solid var(--border);
      border-radius: 18px; padding: 24px; margin-bottom: 20px;
    }
    #drop {
      border: 2px dashed var(--border-accent); border-radius: 14px; padding: 36px 20px;
      text-align: center; cursor: pointer; color: var(--muted); background: var(--track);
      display: flex; flex-direction: column; align-items: center; gap: 10px; transition: all 0.2s;
    }
    #drop:hover, #drop.over { border-color: var(--accent); background: rgba(59,130,246,0.08); }
    .drop-icon-box {
      width: 52px; height: 52px; border-radius: 14px; background: var(--card-solid);
      border: 1px solid var(--border); display: flex; align-items: center; justify-content: center;
      font-size: 1.6rem; color: var(--accent);
    }
    #fileName { font-size: 0.88rem; font-weight: 700; color: var(--accent); word-break: break-all; }
    button#go {
      width: 100%; margin-top: 18px; padding: 13px 20px; font-family: inherit; font-size: 0.98rem; font-weight: 700;
      border: 1px solid var(--border-accent); border-radius: 12px;
      background: linear-gradient(135deg, var(--accent), #1d4ed8); color: #fff; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    button#go:disabled { opacity: 0.45; cursor: not-allowed; }
    #status { font-size: 0.92rem; font-weight: 600; display: flex; align-items: center; gap: 10px; padding: 16px 20px; }
    #status.err { color: var(--danger); background: var(--danger-bg); border-color: rgba(239,68,68,0.3); }
    .spinner { width: 18px; height: 18px; border: 2px solid var(--muted); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .stat { background: var(--track); border-radius: 14px; padding: 18px; border: 1px solid var(--border); }
    .stat .label { font-size: 0.76rem; font-weight: 700; color: var(--muted); text-transform: uppercase; margin-bottom: 6px; }
    .stat .value { font-size: 1.75rem; font-weight: 800; }
    #evidenceWrap { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--border); }
    ul#evidence { list-style: none; display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
    ul#evidence li { padding: 10px 14px; border-radius: 10px; background: var(--track); border: 1px solid var(--border); font-size: 0.88rem; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

<div class="navbar-outer">
  <div class="navbar">
    <a href="/dashboard.html" class="brand">
      <div class="brand-icon"><i class="ph ph-globe-hemisphere-west"></i></div>
      <span>MUN Programmer Portal</span>
    </a>
    <nav>
      <a href="/dashboard.html"><i class="ph ph-squares-four"></i> Dashboard</a>
      <a href="/delegates.html"><i class="ph ph-users-three"></i> Delegates</a>
      <a href="/committees.html"><i class="ph ph-buildings"></i> Committees & Requests</a>
      <a href="/index.html" class="on"><i class="ph ph-file-magnifying-glass"></i> CV Analyzer</a>
    </nav>
    <button id="btnLogout" class="logout"><i class="ph ph-sign-out"></i> Logout</button>
  </div>
</div>

<main>
  <div class="header-title">
    <h1><i class="ph ph-file-text"></i> MUN CV Analyzer</h1>
    <p class="sub">Upload any candidate CV (.pdf or .txt) to evaluate MUN experience &amp; location via the C++ parser.</p>
  </div>

  <div class="card">
    <div id="drop">
      <div class="drop-icon-box"><i class="ph ph-cloud-arrow-up"></i></div>
      <div style="font-weight:700;color:var(--text);">Click or drag a CV file here</div>
      <div style="font-size:0.82rem;">Supports PDF and TXT documents</div>
      <div id="fileName"></div>
    </div>
    <input id="file" type="file" accept=".pdf,.txt" class="hidden">
    <button id="go" disabled><i class="ph ph-sparkle"></i> Analyze CV</button>
  </div>

  <div id="status" class="card hidden"></div>

  <div id="result" class="card hidden">
    <div class="stats">
      <div class="stat">
        <div class="label">MUNs Done</div>
        <div class="value" id="mun">-</div>
      </div>
      <div class="stat">
        <div class="label">Location</div>
        <div class="value" id="loc">-</div>
      </div>
    </div>
    <div id="evidenceWrap" class="hidden">
      <div style="color:var(--muted);font-size:0.8rem;font-weight:700;text-transform:uppercase;">MUN entries found</div>
      <ul id="evidence"></ul>
    </div>
  </div>
</main>

<script>
const drop = document.getElementById("drop");
const fileInput = document.getElementById("file");
const fileName = document.getElementById("fileName");
const go = document.getElementById("go");
const statusBox = document.getElementById("status");
const resultBox = document.getElementById("result");
let chosen = null;

function setFile(f) {
  if (!f) return;
  chosen = f;
  fileName.textContent = f.name;
  go.disabled = false;
}

drop.onclick = () => fileInput.click();
fileInput.onchange = () => setFile(fileInput.files[0]);
drop.ondragover = (e) => { e.preventDefault(); drop.classList.add("over"); };
drop.ondragleave = () => drop.classList.remove("over");
drop.ondrop = (e) => { e.preventDefault(); drop.classList.remove("over"); if (e.dataTransfer.files.length) setFile(e.dataTransfer.files[0]); };

go.onclick = async () => {
  if (!chosen) return;
  go.disabled = true;
  resultBox.classList.add("hidden");
  statusBox.classList.remove("hidden", "err");
  statusBox.innerHTML = '<div class="spinner"></div> Analyzing CV document...';

  const fd = new FormData();
  fd.append("cv", chosen);

  try {
    const res = await fetch("/api/analyze", { method: "POST", body: fd });
    if (res.status === 401 || res.status === 403) { window.location.href = "/login.html"; return; }
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || `Server status ${res.status}`);

    document.getElementById("mun").textContent = data.mun_count ?? "0";
    document.getElementById("loc").textContent = data.location || "Not found";

    const ul = document.getElementById("evidence");
    ul.innerHTML = "";
    (data.matched || []).forEach((m) => {
      const li = document.createElement("li");
      li.textContent = m.replace(/^[-*\u2022\s]+/, "");
      ul.appendChild(li);
    });
    document.getElementById("evidenceWrap").classList.toggle("hidden", !(data.matched || []).length);

    statusBox.classList.add("hidden");
    resultBox.classList.remove("hidden");
  } catch (e) {
    statusBox.classList.add("err");
    statusBox.textContent = "Error: " + e.message;
  } finally {
    go.disabled = false;
  }
};

document.getElementById("btnLogout").onclick = async () => {
  await fetch("/api/auth/logout", { method: "POST" });
  window.location.href = "/login.html";
};
</script>
</body>
</html>

<!DOCTYPE html>
<!-- File: frontend/public/login.html -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MUN Portal - Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <style>
    :root {
      --bg: linear-gradient(135deg, #0b0f19 0%, #111827 50%, #0d1322 100%);
      --card: rgba(23, 31, 48, 0.85);
      --solid: #171f30;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --accent: #3b82f6;
      --accent-glow: rgba(59, 130, 246, 0.25);
      --border: rgba(255, 255, 255, 0.1);
      --track: rgba(255, 255, 255, 0.06);
      --danger: #ef4444;
      --danger-bg: rgba(239, 68, 68, 0.14);
      --success: #10b981;
      --success-bg: rgba(16, 185, 129, 0.14);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }
    .wrap { width: 100%; max-width: 440px; }
    .brand {
      display: flex; align-items: center; justify-content: center; gap: 12px;
      margin-bottom: 24px;
    }
    .brand-icon {
      width: 44px; height: 44px; border-radius: 12px;
      background: linear-gradient(135deg, var(--accent), #1d4ed8);
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 1.5rem; box-shadow: 0 6px 18px var(--accent-glow);
    }
    .brand h1 { font-size: 1.45rem; font-weight: 800; letter-spacing: -0.02em; }
    .brand p { font-size: 0.82rem; color: var(--muted); }
    .card {
      background: var(--card);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 26px;
      box-shadow: 0 18px 40px rgba(0,0,0,0.4);
    }
    .tabs {
      display: grid; grid-template-columns: 1fr 1fr; gap: 6px;
      background: var(--track); padding: 4px; border-radius: 12px;
      margin-bottom: 20px; border: 1px solid var(--border);
    }
    .tabs button {
      padding: 9px; border: 0; border-radius: 9px; font-family: inherit;
      font-size: 0.88rem; font-weight: 700; cursor: pointer;
      background: transparent; color: var(--muted); transition: all 0.2s;
    }
    .tabs button.on { background: var(--solid); color: var(--text); border: 1px solid var(--border); }
    label {
      display: block; font-size: 0.76rem; font-weight: 700; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.05em; margin: 12px 0 5px;
    }
    input {
      width: 100%; padding: 11px 13px; border-radius: 10px;
      border: 1px solid var(--border); background: var(--track);
      color: var(--text); font-family: inherit; font-size: 0.92rem; outline: none;
    }
    input:focus { border-color: var(--accent); }
    .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    button.submit {
      width: 100%; margin-top: 20px; padding: 12px; border: 0; border-radius: 11px;
      background: linear-gradient(135deg, var(--accent), #1d4ed8);
      color: #fff; font-family: inherit; font-size: 0.95rem; font-weight: 700;
      cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
      box-shadow: 0 4px 14px var(--accent-glow);
    }
    button.submit:hover { opacity: 0.95; transform: translateY(-1px); }
    .msg {
      margin-top: 14px; padding: 10px 12px; border-radius: 10px;
      font-size: 0.85rem; font-weight: 600; display: none;
    }
    .msg.err { display: block; background: var(--danger-bg); color: var(--danger); border: 1px solid rgba(239,68,68,0.25); }
    .msg.ok { display: block; background: var(--success-bg); color: var(--success); border: 1px solid rgba(16,185,129,0.25); }
    .demo-box {
      margin-top: 18px; padding: 12px 14px; border-radius: 12px;
      background: var(--track); border: 1px solid var(--border);
      font-size: 0.8rem; color: var(--muted); line-height: 1.6;
    }
    .demo-box strong { color: var(--text); }
    .hidden { display: none; }
  </style>
</head>
<body>
<div class="wrap">
  <div style="margin-bottom:14px;">
    <a href="/" style="display:inline-flex;align-items:center;gap:6px;color:var(--muted);text-decoration:none;font-size:0.84rem;font-weight:600;">
      <i class="ph ph-arrow-left"></i> Back to Home
    </a>
  </div>
  <div class="brand">
    <div class="brand-icon"><i class="ph ph-globe-hemisphere-west"></i></div>
    <div>
      <h1>MUN Management Portal</h1>
      <p>Role-Based Delegate &amp; Programmer Access</p>
    </div>
  </div>

  <div class="card">
    <div class="tabs">
      <button type="button" id="tabLogin" class="on">Sign In</button>
      <button type="button" id="tabRegister">Delegate Sign Up</button>
    </div>

    <!-- Login Form (Both Delegate & Programmer) -->
    <form id="loginForm">
      <label for="l_user">Username</label>
      <input id="l_user" placeholder="e.g. admin or aniket" autocomplete="username" required>
      <label for="l_pass">Password</label>
      <input id="l_pass" type="password" placeholder="Enter password" autocomplete="current-password" required>
      <button type="submit" class="submit"><i class="ph ph-sign-in"></i> Sign In</button>
    </form>

    <!-- Delegate Registration Form -->
    <form id="regForm" class="hidden">
      <label for="r_name">Full Name *</label>
      <input id="r_name" maxlength="100" placeholder="e.g. Riya Verma" required>
      <div class="two">
        <div>
          <label for="r_user">Username *</label>
          <input id="r_user" maxlength="60" placeholder="e.g. riya_v" required>
        </div>
        <div>
          <label for="r_pass">Password *</label>
          <input id="r_pass" type="password" minlength="4" placeholder="Min 4 chars" required>
        </div>
      </div>
      <div class="two">
        <div>
          <label for="r_age">Age *</label>
          <input id="r_age" type="number" min="10" max="100" value="20" required>
        </div>
        <div>
          <label for="r_country">Country *</label>
          <input id="r_country" maxlength="100" placeholder="e.g. India" required>
        </div>
      </div>
      <div style="margin-top:12px;padding:10px 12px;border-radius:10px;background:rgba(59,130,246,0.1);border:1px solid rgba(59,130,246,0.28);font-size:0.8rem;color:#bfdbfe;">
        <i class="ph ph-info"></i> Your MUN score will be verified automatically after you upload your CV inside the Delegate Portal.
      </div>
      <button type="submit" class="submit"><i class="ph ph-user-plus"></i> Create Delegate Account</button>
    </form>

    <div id="msg" class="msg"></div>

    <div class="demo-box">
      <div><strong>Programmer (Admin):</strong> <code>admin</code> / <code>admin123</code></div>
      <div><strong>Delegate (1 MUN):</strong> <code>aniket</code> / <code>user123</code></div>
      <div><strong>Delegate (3 MUNs):</strong> <code>ayush</code> / <code>user123</code></div>
    </div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);

function setMsg(text, isErr) {
  const m = $("msg");
  if (!text) { m.className = "msg"; m.textContent = ""; return; }
  m.className = "msg " + (isErr ? "err" : "ok");
  m.textContent = text;
}

// Auto-redirect if already logged in
fetch("/api/auth/me").then(r => r.ok ? r.json() : null).then(d => {
  if (d && d.authenticated) {
    window.location.href = d.user.role === "admin" ? "/dashboard.html" : "/delegate-portal.html";
  }
}).catch(() => {});

$("tabLogin").onclick = () => {
  $("tabLogin").classList.add("on");
  $("tabRegister").classList.remove("on");
  $("loginForm").classList.remove("hidden");
  $("regForm").classList.add("hidden");
  setMsg("");
};

function showRegisterTab() {
  $("tabRegister").classList.add("on");
  $("tabLogin").classList.remove("on");
  $("regForm").classList.remove("hidden");
  $("loginForm").classList.add("hidden");
  setMsg("");
}

$("tabRegister").onclick = showRegisterTab;

// Automatically switch to Delegate Sign Up when opened from Home page "Sign Up" button
const params = new URLSearchParams(window.location.search);
if (params.get("tab") === "register" || window.location.hash === "#register") {
  showRegisterTab();
}

$("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  setMsg("");
  try {
    const res = await fetch("/api/auth/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username: $("l_user").value.trim(), password: $("l_pass").value })
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || "Login failed.");
    window.location.href = data.redirect;
  } catch (err) { setMsg(err.message, true); }
});

$("regForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  setMsg("");
  try {
    const res = await fetch("/api/auth/register", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        full_name: $("r_name").value.trim(),
        username: $("r_user").value.trim(),
        password: $("r_pass").value,
        age: $("r_age").value,
        country: $("r_country").value.trim(),
      })
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || "Registration failed.");
    window.location.href = data.redirect;
  } catch (err) { setMsg(err.message, true); }
});
</script>
</body>
</html>
